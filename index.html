<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We've Moved</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 20px;
    line-height: 1.6;
    color: #f0f0f0;
    background: #000;
  }
  .stripes {
    display: flex;
    height: 16px;
    margin-bottom: 2rem;
  }
  .stripes span { flex: 1; }
  .stripes span:nth-child(1) { background: #d70000; } /* red */
  .stripes span:nth-child(2) { background: #d7d700; } /* yellow */
  .stripes span:nth-child(3) { background: #00d7d7; } /* cyan */
  .stripes span:nth-child(4) { background: #00d700; } /* green */
  .stripes span:nth-child(5) { background: #d700d7; } /* magenta */
  .stripes span:nth-child(6) { background: #0000d7; } /* blue */
  h1 {
    font-size: 2rem;
    margin-bottom: 1rem;
  }
  p {
    margin-bottom: 1rem;
  }
  a {
    color: #00d7d7;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    margin-bottom: 0.75rem;
  }
</style>
</head>
<body>
  <div class="stripes">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <h1>We've moved.</h1>
  <p>This site and its repositories have a new home. Please update your bookmarks:</p>
  <ul>
    <li><strong>Website:</strong> <a href="https://themainframe.net/">themainframe.net</a></li>
    <li><strong>Repositories:</strong> <a href="https://codeberg.org/Sinclair-Speccy">codeberg.org/Sinclair-Speccy</a></li>
  </ul>
  <p>You can read why <a href="https://blog.themainframe.net/may-12-2026-update-an-actual-domain-now">here</a>.</p>
</body>
</html>
